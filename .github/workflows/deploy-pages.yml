name: Proefversie naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/weheat/package-lock.json

      # Hoofdsite (ddenergie.nl) → /
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Weheat-conversiesites → /weheatofferte/, /weheatkopen/, /warmtepomp-weheat/
      - run: npm ci
        working-directory: sites/weheat
      - name: Weheat-conversiesites bouwen
        working-directory: sites/weheat
        env:
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          for key in weheatofferte weheatkopen warmtepomp-weheat; do
            SITE=$key PUBLIC_BASE_PATH=/$REPO_NAME/$key npx astro build
          done
      - name: Weheat-sites onder de proefversie plaatsen
        run: |
          mkdir -p dist/weheatofferte dist/weheatkopen dist/warmtepomp-weheat
          cp -r sites/weheat/dist/weheatofferte.nl/. dist/weheatofferte/
          cp -r sites/weheat/dist/weheatkopen.nl/. dist/weheatkopen/
          cp -r sites/weheat/dist/warmtepomp-weheat.nl/. dist/warmtepomp-weheat/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
